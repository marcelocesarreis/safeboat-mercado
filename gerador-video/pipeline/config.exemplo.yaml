# Copie para config.yaml e ajuste (o instalar.sh cria o config.yaml sozinho).
# Caminhos relativos são resolvidos a partir da pasta pipeline/.

# Pasta produzida por preparar_dataset.py
dataset: ../dataset

# Onde salvar os vídeos gerados
saida_dir: ../saida

voz:
  # "xtts"       → local e gratuito (Coqui XTTS-v2, clona a partir dos wavs de referência)
  # "elevenlabs" → API paga, qualidade superior (crie a voz no painel com os mesmos wavs)
  backend: xtts
  # elevenlabs_voice_id: SEU_VOICE_ID   # necessário se backend: elevenlabs

video:
  # "sadtalker" → anima uma FOTO sua (referencia/rosto.png) — instalado pelo instalar.sh
  # "wav2lip"   → sincroniza lábios sobre um vídeo REAL seu (referencia/rosto.mp4) — instalação manual
  backend: sadtalker
  sadtalker_dir: ../motores/SadTalker
  wav2lip_dir: ../motores/Wav2Lip
  # Python do ambiente de vídeo (criado pelo instalar.sh). Se ausente, usa o Python atual.
  python: ../.venv-video/bin/python
